<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woof Bus Live Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Shrikhand&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <header class="page-head">
    <div class="wrap stack">
      <div class="row"><span class="pill live" id="status-pill">Live now</span><span class="muted" id="trip-date"></span></div>
      <h1 id="trip-name">Today's Field Trip</h1>
      <p class="lede" id="trip-where">Finding the Woof Bus…</p>
      <div class="row between" style="margin-top:8px">
        <div style="flex:1 1 320px; max-width:560px; display:grid; gap:8px">
          <div class="trip-progress" id="trip-progress"></div>
          <div class="row between muted num" style="font-size:.85rem"><span id="t-start"></span><span id="t-end"></span></div>
        </div>
        <div class="row">
          <button class="btn ghost small" id="replay-btn" type="button">▶ Replay today's trip</button>
          <a class="btn small" href="book.html">Save a seat for next time</a>
        </div>
      </div>
    </div>
  </header>

  <section class="wrap">
    <div class="tracker">
      <div class="map" id="map" role="region" aria-label="Map of today's route"></div>
      <aside class="feed" aria-label="Pupdates from the road">
        <div class="feed-head">
          <div class="row between"><h3>Pupdates</h3><a class="pill sea" href="https://instagram.com/woofriders" target="_blank" rel="noopener">@woofriders</a></div>
          <div class="chips" id="feed-filter"></div>
        </div>
        <div class="feed-list" id="feed"></div>
      </aside>
    </div>
  </section>

  <section class="band tight">
    <div class="wrap grid g2" style="align-items:start">
      <div class="stack">
        <h2 style="font-size:var(--step-2)">Today's itinerary</h2>
        <div class="table-wrap"><table><thead><tr><th>Time</th><th>Stop</th><th>Badge</th><th>Status</th></tr></thead><tbody id="itinerary"></tbody></table></div>
      </div>
      <div class="stack">
        <h2 style="font-size:var(--step-2)">Riding today</h2>
        <div class="grid g3" id="riders"></div>
        <p class="notice sea">Your pup earns each stop's badge as soon as the bus arrives. Tap a pup to see their Pup Passport.</p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/tracker.js"></script>
</body>
</html>
